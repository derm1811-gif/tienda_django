<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías</title>
</head>
<body>
    <h1>Categorías</h1>

    <table border="1">
        <tr>
            <th>Nombre</th>
            <th>Observación</th>
        </tr>

        {% for categoria in categorias %}
            <tr>
                <td>{{ categoria.nombre }}</td>
                <td>{{ categoria.observacion }}</td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="2">No hay categorías registradas.</td>
            </tr>
        {% endfor %}
    </table>
</body>
</html>
