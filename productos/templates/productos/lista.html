<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="{% url 'estilo_css' %}">
</head>

<body>

<h1>Lista de productos</h1>

<a href="{% url 'crear_producto' %}">
    Registrar producto
</a>

<hr>

<table border="1">

    <tr>
        <th>Producto</th>
        <th>Categoría</th>
        <th>Precio</th>
        <th>Cantidad</th>
        <th>Acciones</th>
    </tr>

    {% for producto in productos %}

        <tr>
            <td>{{ producto.nombre }}</td>
            <td>{{ producto.categoria }}</td>
            <td>{{ producto.precio }}</td>
            <td>{{ producto.cantidad }}</td>
            <td>
                <a href="{% url 'detalle_producto' producto.pk %}">Detalle</a>
                |
                <a href="{% url 'editar_producto' producto.pk %}">Editar</a>
                |
                <form method="post" action="{% url 'eliminar_producto' producto.pk %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" onclick="return confirm('¿Seguro que deseas eliminar este producto?')">Eliminar</button>
                </form>
            </td>
        </tr>

    {% empty %}

        <tr>
            <td colspan="5">
                No hay productos registrados.
            </td>
        </tr>

    {% endfor %}

</table>

</body>

</html>
